<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title id="pageTitle">Cliente gerado | ALL Tecnologias</title>
    {% include "_all_theme.html" %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    {% include "_all_header.html" %}
    <main class="all-status-page">
        <div class="all-card all-status-card">
            <div class="all-platform" id="platformName"><i class="fas fa-desktop"></i> {{platform}}</div>
            <h1>Cliente gerado com sucesso</h1>
            <span class="all-badge all-badge-ok">OK</span>
            {% include "_all_downloads.html" %}
            <div id="platformNote" class="all-note all-note-info" style="display:none"></div>
            <p style="margin: var(--space-6) 0 0"><a href="/">Gerar outro cliente</a></p>
        </div>
    </main>

    <script>
        const PLATFORMS = {
            'windows': ['fab fa-windows', 'Windows 64 bits', 'Sem assinatura digital, o Windows SmartScreen pode avisar "Editor desconhecido" na primeira execução: clique em Mais informações → Executar assim mesmo, ou instale pelo Tactical RMM.'],
            'windows-x86': ['fab fa-windows', 'Windows 32 bits', 'Sem assinatura digital, o Windows SmartScreen pode avisar "Editor desconhecido" na primeira execução: clique em Mais informações → Executar assim mesmo, ou instale pelo Tactical RMM.'],
            'linux': ['fab fa-linux', 'Linux', 'Confira se as dependências necessárias estão instaladas na máquina.'],
            'android': ['fab fa-android', 'Android', 'Pode ser preciso permitir a instalação de fontes desconhecidas nas configurações do aparelho.'],
            'macos': ['fab fa-apple', 'macOS', 'No macOS, pode ser preciso ajustar as configurações de segurança para abrir o aplicativo.']
        };
        (function () {
            const platform = '{{platform}}'.toLowerCase();
            const info = PLATFORMS[platform];
            if (!info) return;
            document.getElementById('platformName').innerHTML = '<i class="' + info[0] + '"></i> ' + info[1];
            document.getElementById('pageTitle').textContent = 'Cliente ' + info[1] + ' gerado | ALL Tecnologias';
            const note = document.getElementById('platformNote');
            note.textContent = info[2];
            note.style.display = 'block';
        })();
    </script>
</body>
</html>
