<style>
    /* Tokens do padrao de design ALL Tecnologias (tema escuro) */
    :root {
        --surface-0: #0b1220;
        --surface-100: #121a2b;
        --surface-200: #1a2438;
        --ink: #e6edf5;
        --ink-muted: #9aa8bc;
        --on-brand: #06131d;
        --border: #2a3750;
        --brand: #35a8e0;
        --brand-strong: #6cc3ee;
        --brand-soft: #0f2d3f;
        --status-critical: #f26b6b;
        --status-warning: #f5be4a;
        --status-ok: #3ccb7f;
        --status-critical-soft: #3a1418;
        --status-warning-soft: #3a2b0e;
        --status-ok-soft: #0e2e1f;
        --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
        --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
        --space-6: 24px; --space-8: 32px; --space-12: 48px;
        --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-pill: 999px;
        --shadow-card: 0 1px 2px rgba(0,0,0,0.35);
        color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--surface-0); }
    body {
        margin: 0;
        color: var(--ink);
        font: 400 15px/22px var(--font-sans);
    }
    a { color: var(--brand-strong); }
    a:hover { color: var(--brand); }
    code, .mono { font: 400 13px/20px var(--font-mono); }

    /* Barra do topo */
    .all-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-4);
        padding: var(--space-3) var(--space-6);
        background: var(--surface-100);
        border-bottom: 1px solid var(--border);
    }
    .all-topbar img { height: 56px; width: auto; display: block; }
    .all-topbar .all-topbar-title {
        font: 600 13px/18px var(--font-sans);
        color: var(--ink-muted);
        text-align: right;
    }

    /* Componentes comuns */
    .all-card {
        background: var(--surface-100);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: var(--space-6);
    }
    .all-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        background: var(--brand);
        color: var(--on-brand);
        border: 1px solid var(--brand);
        border-radius: var(--radius-md);
        padding: var(--space-2) var(--space-4);
        font: 600 15px/22px var(--font-sans);
        text-decoration: none;
        cursor: pointer;
    }
    .all-btn:hover { background: var(--brand-strong); border-color: var(--brand-strong); color: var(--on-brand); }
    .all-btn-secondary {
        background: transparent;
        color: var(--ink);
        border-color: var(--border);
    }
    .all-btn-secondary:hover { background: var(--surface-200); border-color: var(--border); color: var(--ink); }
    .all-label {
        font: 600 12px/16px var(--font-sans);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--ink-muted);
    }
    .all-badge {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-1) var(--space-2);
        border-radius: var(--radius-sm);
        font: 600 12px/16px var(--font-sans);
    }
    .all-badge::before {
        content: "";
        width: 8px; height: 8px;
        border-radius: var(--radius-pill);
        background: currentColor;
    }
    .all-badge-ok { background: var(--status-ok-soft); color: var(--status-ok); }
    .all-badge-warning { background: var(--status-warning-soft); color: var(--status-warning); }
    .all-badge-critical { background: var(--status-critical-soft); color: var(--status-critical); }
    .all-note {
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: var(--space-3) var(--space-4);
        font: 400 13px/18px var(--font-sans);
        color: var(--ink);
        text-align: left;
    }
    .all-note-warning { background: var(--status-warning-soft); border-color: var(--status-warning); }
    .all-note-critical { background: var(--status-critical-soft); border-color: var(--status-critical); }
    .all-note-info { background: var(--brand-soft); border-color: var(--brand); }
    .all-footer {
        text-align: center;
        padding: var(--space-8) var(--space-6);
        font: 400 13px/18px var(--font-sans);
        color: var(--ink-muted);
    }
    .all-footer a { color: var(--ink-muted); }

    /* Paginas de status (aguardando, gerado, falha, manutencao) */
    .all-status-page {
        min-height: calc(100vh - 81px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-8) var(--space-4);
    }
    .all-status-card {
        width: 100%;
        max-width: 560px;
        text-align: center;
        box-shadow: var(--shadow-card);
        border-radius: var(--radius-lg);
    }
    .all-status-card h1 { font: 700 28px/34px var(--font-sans); margin: var(--space-4) 0 var(--space-2); }
    .all-status-card p { color: var(--ink-muted); margin: 0 0 var(--space-4); }
    .all-status-card .all-downloads { display: grid; gap: var(--space-2); margin: var(--space-6) 0 var(--space-4); }
    .all-status-card .all-downloads .all-btn { width: 100%; font-family: var(--font-mono); font-size: 13px; }
    .all-spinner {
        width: 40px; height: 40px;
        margin: var(--space-6) auto;
        border: 4px solid var(--surface-200);
        border-top-color: var(--brand);
        border-radius: 50%;
        animation: all-spin 1s linear infinite;
    }
    @keyframes all-spin { to { transform: rotate(360deg); } }
    .all-platform { font: 600 13px/18px var(--font-sans); color: var(--ink-muted); }
    .all-platform i { color: var(--brand); margin-right: var(--space-1); }
    @media (max-width: 640px) {
        .all-topbar { padding: var(--space-3) var(--space-4); }
        .all-topbar img { height: 42px; }
        .all-topbar .all-topbar-title { display: none; }
    }
</style>
