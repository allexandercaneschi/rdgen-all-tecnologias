name: imagem docker ALL (GHCR)

# Publica a imagem do gerador (com a traducao pt-BR e o tema ALL Tecnologias)
# em ghcr.io/<dono>/<repositorio>.
#   push na master  -> :latest e :all
#   tag vX.Y.Z      -> :vX.Y.Z
#   manual          -> :latest e :all

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nome da imagem em minusculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Definir tags
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "TAGS=${IMAGE}:${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "TAGS=${IMAGE}:latest,${IMAGE}:all" >> "$GITHUB_ENV"
          fi

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Gerador de cliente RustDesk (RDGen) traduzido para pt-BR com o tema ALL Tecnologias
            org.opencontainers.image.licenses=GPL-3.0
